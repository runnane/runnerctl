# Managed by ops/runners/runnerctl (profile: deploy) — DO NOT EDIT BY HAND.
# Prod deploy runner (example-prod) — on-device secrets, uncapped, auto-restart.
# See ops/runners/README.md for details.
[Unit]
# Don't let a crash-loop trip the start limiter and park the unit 'failed'.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=15
# On-device secrets/config (root-owned, chmod 600). Never in GitHub.
EnvironmentFile=/etc/example-prod/deploy.env

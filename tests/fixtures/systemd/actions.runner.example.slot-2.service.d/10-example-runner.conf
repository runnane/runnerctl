# Managed by ops/runners/runnerctl (profile: ci) — DO NOT EDIT BY HAND.
# CI build/test pool (self-hosted-pool) — memory-capped, auto-restart.
# See ops/runners/README.md for details.
[Unit]
# Don't let a crash-loop trip the start limiter and park the unit 'failed'.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
# MemoryHigh: soft reclaim/throttle before the hard cap.
# MemoryMax:  hard — contains a runaway to its cgroup; Restart resurrects it.
MemoryHigh=20G
MemoryMax=24G

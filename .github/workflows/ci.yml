name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is pinned to the same release the gates document
      # (.agents/gates.md): the official static linux x86_64 tarball, checked
      # against a SHA-256 recorded here before it is unpacked. A mismatch
      # fails the step (sha256sum -c exits non-zero under bash -e) and the
      # binary never reaches PATH. Bump version and checksum together.
      - name: Install shellcheck v0.11.0
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/shellcheck.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/shellcheck-bin" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-bin/shellcheck" --version
      - run: make gates
        shell: bash

  # Release automation (release-please, conventional commits). On every push
  # to main with green gates it opens or refreshes ONE release PR that bumps
  # RUNNERCTL_VERSION (via the x-release-please-version annotation), writes
  # CHANGELOG.md and .release-please-manifest.json. Merging that PR creates
  # the vX.Y.Z tag and GitHub release; the script is then attached to the
  # release so `runnerctl upgrade --ref vX.Y.Z` has a stable artifact, with
  # its SHA-256 beside it as runnerctl.sha256 for `upgrade` to verify against.
  #
  # Feature PRs never touch the version line or the changelog, so they never
  # conflict on either. Never bump RUNNERCTL_VERSION by hand.
  #
  # RELEASE_APP_ID (repo variable) + RELEASE_APP_PRIVATE_KEY (repo secret)
  # name a GitHub App installed on this repo with contents + pull-requests
  # write. With both set, the release PR is authored by that app and its
  # gates start like any other PR's. Without them the job falls back to the
  # default GITHUB_TOKEN: the PR is then authored by github-actions[bot],
  # whose pull_request runs GitHub creates but holds for a manual approval,
  # so the bumped script is only gated unattended by the post-merge run on
  # main.
  #
  # release-please acts on the BRANCH, not on this run's commit, so the run
  # that creates a release is whichever one gets there first once the release
  # PR has merged — not necessarily the release commit's own (GHR-106: four
  # merges in 23 seconds, the release was created by an earlier commit's run,
  # which then attached nothing, and v0.20.0 went out with no asset). Hence
  # the attach step's checkout names the tag the release step just created,
  # and the job runs one at a time so two pushes never interleave it. A run
  # in progress is never cancelled; of several waiting, GitHub keeps the
  # newest, which is fine: any of them does the same work on the same branch.
  release:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The tagged commit, not this run's: see the note above the job. The
      # version assertion below stays as the guard that refuses wrong bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      # GHR-84: the digest `runnerctl upgrade` checks a release download
      # against — one `sha256sum` line naming `runnerctl`, written from the
      # same checked-out tag bytes the next step uploads, and only once they
      # carry the tag's version. tests/upgrade-test.sh pins this exact command
      # and verifies digests made with it.
      - name: Write runnerctl.sha256
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          ./runnerctl version | grep -qx "runnerctl ${TAG#v}"
          sha256sum runnerctl > runnerctl.sha256
      - name: Attach runnerctl to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          ./runnerctl version | grep -qx "runnerctl ${TAG#v}"
          gh release upload "$TAG" runnerctl runnerctl.sha256 --clobber

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: make gates
        shell: bash

  # Release automation (release-please, conventional commits). On every push
  # to main with green gates it opens or refreshes ONE release PR that bumps
  # RUNNERCTL_VERSION (via the x-release-please-version annotation), writes
  # CHANGELOG.md and .release-please-manifest.json. Merging that PR creates
  # the vX.Y.Z tag and GitHub release; the script is then attached to the
  # release so `runnerctl upgrade --ref vX.Y.Z` has a stable artifact.
  #
  # Feature PRs never touch the version line or the changelog, so they never
  # conflict on either. Never bump RUNNERCTL_VERSION by hand.
  #
  # RELEASE_APP_ID (repo variable) + RELEASE_APP_PRIVATE_KEY (repo secret)
  # name a GitHub App installed on this repo with contents + pull-requests
  # write. With both set, the release PR is authored by that app and its
  # gates start like any other PR's. Without them the job falls back to the
  # default GITHUB_TOKEN: the PR is then authored by github-actions[bot],
  # whose pull_request runs GitHub creates but holds for a manual approval,
  # so the bumped script is only gated unattended by the post-merge run on
  # main.
  release:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - name: Attach runnerctl to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          ./runnerctl version | grep -qx "runnerctl ${TAG#v}"
          gh release upload "$TAG" runnerctl --clobber
